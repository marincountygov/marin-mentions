  # --- Topics ---
  # AND-clause pattern ([word:Marin, word:TERM]) instead of full literal
  # phrases — the previous Flooding/Officials/Budget monitors used
  # contiguous phrases ("Marin County budget", "Marin budget") and matched
  # almost nothing (0-2 items each) because real coverage rarely repeats
  # that exact phrasing verbatim. Requiring Marin AND the topic word to each
  # appear anywhere in the text, independently, catches far more real
  # coverage — confirmed directly: Fire went from a similarly narrow
  # phrase-based monitor to 24 genuine matches on this pattern.
  # word: avoids substring false positives on short/generic terms (e.g.
  # bare "budget" is safe, but bare "flood" would also match "floodlight").
  #
  # The anchor term itself is bare word:Marin (2026-10-01), not the literal
  # phrase "Marin County" — real coverage refers to the county as "Marin
  # County," "County of Marin," or just "Marin" more or less interchangeably,
  # and the old literal-phrase anchor silently missed every AND-clause match
  # that used either of the other two. word:Marin catches all three, since
  # each one contains the standalone word "Marin" somewhere in it. This same
  # change was made to every `[Marin County, ...]` AND-clause throughout this
  # file (Departments, Districts, Towns), not just Topics.
  #
  # Organized below (2026-10-01) around the County's first strategic plan in
  # 25+ years, built on 6 named priority areas — each gets a comment banner
  # here (Housing, Equity, Climate & Sustainability, Emergency Readiness,
  # Capital & Infrastructure, Economy) plus one new monitor built from that
  # priority's official phrase (as a literal include term, since coverage may
  # quote it verbatim) and a few topical AND-clauses. These are organizing
  # banners only, not sidebar groups — every monitor below still has
  # group: Topics, same as before, and assets/app.js sorts monitors within a
  # group alphabetically by name regardless of file order.
  - id: marin-county
    name: General
    group: Topics
    # Merged 2026-10-01 with the old Reddit-only "Marin (general mention)"
    # monitor (bare word:Marin, kept platform-scoped specifically to avoid
    # firing on News/Video) into this one. Deliberate tradeoff: word:Marin
    # now applies everywhere, so this is broader/noisier on News/Video than
    # the old "Marin County"-phrase-only version was — accepted in exchange
    # for one simpler monitor instead of two.
    #
    # Re-split 2026-10-02: bluesky carved back out, this time for the
    # opposite reason reddit originally got the broad bare-word treatment.
    # reddit's connector only polls a curated, already Bay-Area-relevant
    # subreddit list (r/Marin, r/bayarea, r/SanRafael, etc. — see
    # build/connectors/reddit.js config), so bare "Marin" chatter there is
    # genuinely almost always on-topic. bluesky's connector is a true
    # unscoped keyword search across the entire network — confirmed live,
    # its "Top social accounts" was dominated by unrelated bot/spam
    # accounts and people/places that just happen to share the name
    # (a Scotland jobs bot, "aiko fangirl da ada e marin," etc.), none of
    # which ever say "Marin County." See marin-county-bluesky below for the
    # stricter phrase-only version scoped to just bluesky.
    sourceMethods: [rss, google-news, youtube, reddit]
    include:
      - word:Marin
    exclude:
      - Marin County Florida
      - Marin County, Florida

  - id: marin-county-bluesky
    name: General (Bluesky)
    group: Topics
    sourceMethods: [bluesky]
    include:
      - Marin County
      - County of Marin
    exclude:
      - Marin County Florida
      - Marin County, Florida

  - id: marin-strategic-plan-topic
    name: Strategic plan
    group: Topics
    include:
      - [word:Marin, strategic plan]
      - [word:Marin, Envision]

