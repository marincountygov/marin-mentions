  # --- People ---
  # One monitor per person (not one "People" monitor with everyone lumped
  # in) so the sidebar's People group can filter down to a single person.
  # Bare full names, not "Supervisor <name>" — substring matching means the
  # bare name already catches "Supervisor Mary Sackett" too, and also
  # catches headlines that drop the title.
