  # --- Topics ---
  # AND-clause pattern ([Marin County, word:TERM]) instead of full literal
  # phrases — the previous Flooding/Officials/Budget monitors used
  # contiguous phrases ("Marin County budget", "Marin budget") and matched
  # almost nothing (0-2 items each) because real coverage rarely repeats
  # that exact phrasing verbatim. Requiring "Marin County" AND the topic
  # word to each appear anywhere in the text, independently, catches far
  # more real coverage — confirmed directly: Fire went from a similarly
  # narrow phrase-based monitor to 24 genuine matches on this pattern.
  # word: avoids substring false positives on short/generic terms (e.g.
  # bare "budget" is safe, but bare "flood" would also match "floodlight").
  - id: marin-county
    name: Marin County
    group: Topics
    # No youtubeSearch here (unlike other Topics monitors) — confirmed live
    # 2026-09-25: this bare geographic phrase pulls from an enormous,
    # mostly-unrelated YouTube results pool (totalResults in the tens of
    # thousands), surfacing hotel reviews, real estate listings, and other
    # commercial content that's genuinely located in Marin County but has
    # nothing to do with county government. The other youtubeSearch-flagged
    # monitors are department/entity names with no such ambiguity. See
    # build/connectors/youtube.js's own comment for the full story.
    include:
      - Marin County
      - County of Marin
      - Marin Co.
      - Marin agencies
      - [Marin County, government]
    exclude:
      - Marin County Florida
      - Marin County, Florida

  # Reddit-only, deliberately broader than every monitor above: casual
  # Reddit chatter about Marin almost never uses a full phrase like "Marin
  # County" — confirmed directly, genuine matches were landing at 0-1 per
  # poll against 200 real raw items. sourceMethods restricts this to
  # Reddit specifically (see build/match.js) so News/Video keep their
  # existing phrase-level precision; accepting more noise here (e.g. a
  # person named Marin) is the deliberate tradeoff for more recall on a
  # platform that's inherently casual chatter, not curated coverage.
  - id: marin-broad-reddit
    name: Marin (general mention)
    group: Topics
    sourceMethods: [reddit]
    include:
      - word:Marin

  # Wildfire coverage generally, distinct from marin-fire (the Fire
  # Department as an organization, under Departments above) — this one
  # matches even when the Department itself isn't named. word: on "fire"/
  # "fires" avoids substring false positives on unrelated words containing
  # them (e.g. bare "fires" would match inside "expires"); "wildfire" is
  # safe as a plain substring, it's not a substring of anything unrelated.
  - id: marin-fire-topic
    name: Fire
    group: Topics
    include:
      - [Marin County, word:fire]
      - [Marin County, word:fires]
      - [Marin County, wildfire]

