      - [4th District, word:Marin]
      - Dennis Rodoni

  - id: marin-district-5
    name: Marin District 5
    group: Districts
    include:
      - [District 5, word:Marin]
      - [5th District, word:Marin]
      - Eric Lucan
      - Magali Limeta

