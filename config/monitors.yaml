  # --- Towns ---
  # Marin County incorporated cities and towns plus commonly recognized
  # unincorporated communities and places.
  #
  # Distinctive place names match as standalone phrases. Common or ambiguous
  # names are paired with Marin to reduce false positives. Two of this
  # list's own pairings (Alto, Ross) also get a word: prefix on top of that
  # — both are substrings of something unrelated (Alto inside "Palo Alto",
  # already a configured source in this project; Ross inside "across"/
  # "gross"/"crossroads") that a bare Marin pairing alone wouldn't catch,
  # same fix already applied to these same two names in the Districts
  # section above. San Rafael is paired with Marin for the same reason it
  # already is in Districts — it's a common place name outside Marin too
  # (there's a San Rafael in Argentina, Guatemala, and elsewhere).
