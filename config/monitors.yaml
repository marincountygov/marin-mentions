# Monitor configuration for marin-mentions.
#
# Each monitor is a named set of include/exclude phrases. Matching is
# case-insensitive and normalizes whitespace/punctuation (see
# build/match.js) — it is deliberately simple string/phrase matching, not
# NLP. A monitor matches an item if ANY include entry is found and NO
# exclude entry is found.
#
# An include/exclude entry is usually a single phrase (a string). It can
# also be a list of phrases, meaning ALL of them must be present (an AND
# clause) — for a term too generic to use alone:
#   - [word:MCA, Marin]   # matches only if BOTH "MCA" and "Marin" appear
#
# A "word:" prefix on any single term (standalone or inside an AND clause)
# matches that term as a whole word only, not as a substring of a longer
# word — e.g. word:MCA matches "MCA" but not "MCAL" (a real false positive
# found in production: the Marin County Athletic League). Plain terms
# without the prefix keep the default substring behavior, which several
# other monitors rely on (e.g. "Marin Fire" matching "Marin Fire
# Department").
#
# `group` is UI-only — it controls how monitors are grouped in the
# Console's sidebar and on /monitors. Display order of the groups
# themselves is set by assets/app.js's MONITOR_GROUP_ORDER, not the order
# they appear in this file; a group left out of that list falls back to
# alphabetical and sorts after every explicitly ordered one. `group` has no
# effect on matching either way.
#
# Add a new monitor by adding an entry here.

monitors:
  # --- Board & Courts ---
  - id: marin-supervisors
    name: Marin Board of Supervisors
    group: Board & Courts
    youtubeSearch: true
    include:
      - Marin Board of Supervisors
      - Marin County Board of Supervisors
      - Marin County supervisor
      - [Marin County, supervisor]

  - id: marin-superior-court
    name: Marin County Superior Court
    group: Board & Courts
    youtubeSearch: true
    include:
      - Marin County Superior Court
      - Marin Superior Court
      - Superior Court of Marin County

  - id: marin-grand-jury
    name: Marin County Civil Grand Jury
    group: Board & Courts
    include:
      - Marin County Civil Grand Jury
      - Marin Civil Grand Jury
      - Marin Grand Jury

  # --- Districts ---
  # "District <N>" and "<N>th District" are too generic alone (school
  # districts, fire districts, voting districts elsewhere all use the same
  # phrasing) — paired with "Marin" as a compound AND clause to stay
  # scoped to these five Board of Supervisors districts specifically. Each
  # district's representative name is added as its own standalone term
  # (already unambiguous, no Marin pairing needed) so a story naming just
  # the supervisor still surfaces under their district.
  - id: marin-district-1
    name: Marin District 1
    group: Districts
    include:
      - [District 1, word:Marin]
      - [1st District, word:Marin]
      - Mary Sackett

  - id: marin-district-2
