name: Build and deploy

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs under load — the
    # per-source refreshIntervalMinutes in config/sources.yaml (checked
    # inside build/index.js against the previously published snapshot) is
    # what actually governs how often each source is re-fetched, so an
    # occasional late/skipped run doesn't break the caching model.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Stage static site
        run: |
          mkdir -p dist
          cp -r index.html filters.json filters-sources.json assets vendor security.json marin.yml .well-known dist/

      - name: Build data.json (merging with the currently live snapshot)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          node build/index.js \
            --out=dist/data.json \
            --previous="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # The site includes .well-known/security.txt. Version 4 and later leave out folders that start with a dot unless asked.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
